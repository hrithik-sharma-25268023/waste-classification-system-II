name: waste-classification
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.10

  # Deep Learning & ML Frameworks
  - tensorflow=2.13.*
  - tensorflow-gpu=2.13.*
  - keras=2.13.*

  # Scientific Computing
  - numpy>=1.21.0
  - pandas>=1.3.0
  - scipy>=1.7.0
  - scikit-learn>=1.0.0
  - scikit-image>=0.19.0

  # Image Processing & Computer Vision
  - opencv=4.8.*
  - pillow>=9.0.0
  - imageio>=2.9.0

  # Visualization
  - matplotlib>=3.4.0
  - seaborn>=0.11.0
  - plotly>=5.0.0

  # Data & Experiment Tracking
  - notebook>=6.4.0
  - ipython>=7.0.0
  - ipywidgets>=7.6.0
  - ipykernel

  # Utilities
  - tqdm>=4.62.0
  - pip
  
pip:
  # TensorFlow Lite & Model Conversion
  - tensorflow-lite-support==0.4.4
  - tf-lite-support==0.4.4
  - onnx==1.14.0
  - onnxruntime==1.16.0
  
  # Image Data Augmentation
  - albumentations>=1.3.0
  - imgaug>=0.4.0
  - torchvision-transforms-augmentation>=0.1.0
  
  # Model Compression & Optimization
  - neural-compressor>=2.1.0
  - tensorflow-model-optimization>=0.7.0
  
  # Mobile/Edge Deployment
  - tflite-support==0.4.4
  - mediapipe>=0.8.9.1
  
  # Data Management & Processing
  - opencv-python>=4.6.0
  - python-cv2>=4.6.0
  - pydantic>=1.9.0
